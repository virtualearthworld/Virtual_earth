<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Earth — Word Puzzle</title><style>:root{color-scheme:dark}body{font:18px system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#08111f;color:#eef5ff}a{color:#69d7b0}.panel{background:#162941;border:1px solid #2b4059;border-radius:18px;padding:24px;margin-top:20px}button,input{font:inherit;padding:12px;border-radius:10px;margin:6px 6px 6px 0}button{background:#69d7b0;border:0;cursor:pointer;font-weight:700}input{max-width:90%;background:#0a1727;color:#eef5ff;border:1px solid #2b4059}#scramble{font-size:2.5rem;letter-spacing:.25em;font-weight:800}#status{min-height:2em;color:#69d7b0}</style></head>
<body><a href="index.html">← Back to Virtual Earth home</a><h1>🧩 Word Puzzle</h1><p>Unscramble the word. Earn 5 coins for each word you solve correctly, once per word.</p><div class="panel"><p>🪙 Shared balance: <strong id="balance">0</strong> coins</p><p>Puzzle <strong id="number">1</strong> of 10</p><div id="scramble" aria-live="polite"></div><label for="answer">Your answer</label><br><input id="answer" autocomplete="off" placeholder="Type the word"><br><button id="submit">Submit answer</button><button id="next" type="button">Next puzzle</button><p id="status" aria-live="polite"></p><p id="progress"></p></div><script>
(()=>{const key='virtualEarthChallengeProgressV1';const words=['APPLE','PLANET','BRIDGE','FOREST','OCEAN','GARDEN','CASTLE','PUZZLE','MARKET','ISLAND'];let idx=0,shown='';const el=id=>document.getElementById(id);function read(){try{let p=JSON.parse(localStorage.getItem(key)||'{}');return{coins:Number(p.coins)||0,completed:Array.isArray(p.completed)?p.completed:[],transactions:Array.isArray(p.transactions)?p.transactions:[]}}catch(e){return{coins:0,completed:[],transactions:[]}}}function mix(w){let a=w.split('');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.join('')===w)[a[0],a[1]]=[a[1],a[0]];return a.join('')}function render(){shown=mix(words[idx]);el('scramble').textContent=shown;el('number').textContent=idx+1;el('answer').value='';el('status').textContent='';let p=read();el('balance').textContent=p.coins;el('progress').textContent='Solved: '+words.filter(w=>p.completed.includes('word-puzzle-'+w)).length+' / 10';}el('submit').addEventListener('click',()=>{let word=words[idx],guess=el('answer').value.trim().toUpperCase();if(!guess){el('status').textContent='Type your answer first.';return}if(guess!==word){el('status').textContent='Not quite—try again.';return}let p=read(),id='word-puzzle-'+word;if(p.completed.includes(id)){el('status').textContent='Correct! You already claimed the reward for this word.';return}p.coins+=5;p.completed.push(id);p.transactions.unshift({id,title:'Word Puzzle: '+word,amount:5,date:new Date().toISOString(),balanceAfter:p.coins});try{localStorage.setItem(key,JSON.stringify(p))}catch(e){el('status').textContent='Could not save progress in this browser. Please check browser storage settings.';return}el('balance').textContent=p.coins;el('progress').textContent='Solved: '+words.filter(w=>p.completed.includes('word-puzzle-'+w)).length+' / 10';el('status').textContent='Correct! +5 coins added to your shared balance.'});el('answer').addEventListener('keydown',e=>{if(e.key==='Enter')el('submit').click()});el('next').addEventListener('click',()=>{idx=(idx+1)%words.length;render()});window.addEventListener('storage',e=>{if(e.key===key){let p=read();el('balance').textContent=p.coins;el('progress').textContent='Solved: '+words.filter(w=>p.completed.includes('word-puzzle-'+w)).length+' / 10'}});render()})();
</script></body></html>
